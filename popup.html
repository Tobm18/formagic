<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Formagic</title>
<style>
  :root { --bg:#ffffff; --fg:#1d2330; --muted:#677084; --line:#e3e6ec; --accent:#e5484d; --hover:#f3f4f7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1e25; --fg:#e8eaf0; --muted:#9aa1b2; --line:#2e333d; --hover:#262a33; } }
  * { box-sizing: border-box; }
  body { margin:0; width: 300px; font: 13px/1.4 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  header { display:flex; align-items:center; gap:10px; padding: 14px 16px 10px; }
  header img { width: 28px; height: 28px; }
  header b { font-size: 15px; }
  .btn { display:flex; align-items:center; gap:10px; width:100%; padding: 10px 16px; border:0; background:none; color:inherit; font:inherit; text-align:left; cursor:pointer; }
  .btn:hover { background: var(--hover); }
  .btn svg { width:18px; height:18px; flex:none; }
  hr { border:0; border-top:1px solid var(--line); margin: 6px 0; }
  label.row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding: 10px 16px; cursor:pointer; }
  .hint { padding: 0 16px 12px; color: var(--muted); font-size: 12px; }
  .warn { margin: 4px 12px 12px; padding: 8px 10px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 12%, transparent); font-size: 12px; }
  .warn a { color: var(--accent); cursor: pointer; text-decoration: underline; }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
</style>
</head>
<body>
  <header><img src="icons/icon48.png" alt=""><b>Formagic</b></header>
  <button class="btn" id="open">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1"/><path d="M3 7v10a2 2 0 0 0 2 2h12.5a2 2 0 0 0 1.9-1.4L22 11H7.5a2 2 0 0 0-1.9 1.4L3 19"/></svg>
    Ouvrir un PDF ou des images…
  </button>
  <button class="btn" id="new">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></svg>
    Nouveau document vierge
  </button>
  <hr>
  <label class="row">Ouvrir automatiquement les PDF <input type="checkbox" id="intercept"></label>
  <div class="hint">Les PDF des sites web s'ouvrent dans Formagic au lieu du lecteur de Chrome.</div>
  <div class="warn" id="fileWarn" hidden>
    Pour ouvrir les PDF de votre ordinateur, activez « Autoriser l'accès aux URL de fichier » dans <a id="ext">les détails de l'extension</a>.
  </div>
<script src="popup.js"></script>
</body>
</html>
